name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          for file in lib/*.mjs; do node --check "$file"; done
          node --check lib/client.js

      - name: Offline tests
        run: |
          node test/offline.test.mjs
          node test/client.test.mjs

      - name: Package manifest check
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client) process.exit(1); console.log('package.json OK')"
